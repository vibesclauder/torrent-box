# Drop-in for systemd-journald:
#   /etc/systemd/journald.conf.d/torrent-box.conf
# Keep the journal (all system services and the user units: transmission-daemon,
# jellyfin/minidlna, ntfy, samba, rss2transmission, dashboard, arr-update...) for 3 days.
# MaxFileSec rotates daily so the 3-day cut is granular; SystemMaxUse is a safety ceiling.
# This file has no @placeholders@; setup.sh installs it as-is.
[Journal]
Storage=persistent
MaxRetentionSec=3day
MaxFileSec=1day
SystemMaxUse=200M

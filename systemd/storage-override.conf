# Drop-in for transmission-daemon and minidlna (system units):
#   /etc/systemd/system/<unit>.service.d/override.conf
# Start only once the storage disk is mounted, and keep restarting on failure.
# setup.sh replaces @STORAGE_ROOT@ with the configured storage_root.
[Unit]
RequiresMountsFor=@STORAGE_ROOT@
After=network-online.target
Wants=network-online.target
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=30

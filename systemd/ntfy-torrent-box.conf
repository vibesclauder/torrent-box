# torrent-box's settings for the ntfy server (the distro's ntfy package), installed by setup.sh
# as /etc/systemd/system/ntfy.service.d/torrent-box.conf; edits here are overwritten on the next
# run. ntfy reads NTFY_* variables like its server.yml keys, so the package's own
# /etc/ntfy/server.yml stays untouched (and package upgrades don't ask about it).
[Service]
# ntfy's default, port 80, is the start page's. ufw lets in only the LAN and the tailnet.
Environment=NTFY_LISTEN_HTTP=:@PORT@
# Messages wait here for a phone that's off the tailnet for a while (up to 3 days), and it
# fetches what it missed when it's back.
Environment=NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
Environment=NTFY_CACHE_DURATION=72h
CacheDirectory=ntfy
Restart=always
RestartSec=5

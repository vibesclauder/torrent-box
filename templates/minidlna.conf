# minidlna configuration, written by torrent-box setup.sh from templates/minidlna.conf.
# Re-running setup.sh overwrites it; the distribution's original is kept as minidlna.conf.orig.
# setup.sh forces a rescan whenever media_dir changes.

media_dir=@STORAGE_ROOT@
friendly_name=@HOSTNAME@
db_dir=/var/cache/minidlna
port=8200
# Pick up new downloads without a rescan.
inotify=yes
album_art_names=Cover.jpg/cover.jpg/AlbumArtSmall.jpg/albumartsmall.jpg
album_art_names=AlbumArt.jpg/albumart.jpg/Album.jpg/album.jpg
album_art_names=Folder.jpg/folder.jpg/Thumb.jpg/thumb.jpg

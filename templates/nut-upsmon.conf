# torrent-box (setup.sh, [setup] ups): upsmon watches the UPS and shuts the box down when its
# battery runs low (NUT's own job: nothing of torrent-box's has to run for it). Installed to
# /etc/nut/upsmon.conf (root and the nut group only: it holds the password).
RUN_AS_USER nut
MONITOR ups@127.0.0.1 1 upsmon @PASSWORD@ primary
MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h +0"
POLLFREQ 5
POLLFREQALERT 5
DEADTIME 15
FINALDELAY 5
POWERDOWNFLAG "/etc/killpower"
RBWARNTIME 43200
NOCOMMWARNTIME 300

# The events torrent-box pushes and logs (ups-notify hands them to rss2transmission). Only a
# convenience: the shutdown doesn't wait for it.
NOTIFYCMD @LIB@/ups-notify
NOTIFYFLAG ONLINE SYSLOG+EXEC
NOTIFYFLAG ONBATT SYSLOG+EXEC
NOTIFYFLAG LOWBATT SYSLOG+EXEC
NOTIFYFLAG COMMOK SYSLOG+EXEC
NOTIFYFLAG COMMBAD SYSLOG+EXEC
NOTIFYFLAG NOCOMM SYSLOG+EXEC
NOTIFYFLAG SHUTDOWN SYSLOG+EXEC
NOTIFYFLAG REPLBATT SYSLOG+EXEC

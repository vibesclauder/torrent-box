# torrent-box (setup.sh, [setup] ups): the UPS on USB. Installed to /etc/nut/ups.conf.
maxretry = 3

[ups]
	driver = usbhid-ups
	port = auto
@MATCH@	desc = "@DESC@"
	# Low battery: worked out by NUT from these ([setup] ups_low_battery), not the UPS's own
	# (often 20%, too little for an ageing battery)
	ignorelb
	override.battery.charge.low = @LOW_BATTERY@
	override.battery.runtime.low = 120

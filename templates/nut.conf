# torrent-box (setup.sh, [setup] ups): NUT on its own on this box (driver, upsd and upsmon).
# Installed to /etc/nut/nut.conf; the package's own is kept as nut.conf.before-torrent-box and
# put back when [setup] ups is switched to no.
MODE=standalone
# After a shutdown on low battery the UPS is told to cut the power (and to turn it on again
# when the mains is back, which starts the box if its BIOS powers on after a power loss). If
# the mains came back during the shutdown and the UPS doesn't cut it, the box would stay off
# for good: it reboots after this long instead.
POWEROFF_WAIT=15m

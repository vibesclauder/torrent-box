# Samba share of the storage disk, written by torrent-box setup.sh from templates/samba.conf
# and included from the end of /etc/samba/smb.conf. Re-running setup.sh overwrites it.
# smbd only starts once the disk is mounted (drop-in), so nothing lands on the system disk.

[storage]
   comment = torrent-box storage disk
   path = @STORAGE_ROOT@
   valid users = @USER@
   read only = no
   # LAN only (IPv6 link-local too: Windows often connects that way when it found the box via
   # wsdd), plus the tailnet when Tailscale is set up
   hosts allow = @HOSTS_ALLOW@
   hosts deny = ALL
   # Group-writable files, like Transmission's (umask 002); the setgid folders keep the
   # debian-transmission group, and "other" can read (the media server).
   create mask = 0664
   directory mask = 0775

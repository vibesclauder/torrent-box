# Copy to ~/.config/rss2transmission/secrets.ini (chmod 600). Never commit the real one.
[secrets]
feed_url     = https://ncore.pro/bookmarks/<your-key>
rpc_user     = <transmission user>
rpc_password = <transmission password>
ntfy_topic   = torrent-box-<random string>
# Only with [setup] arr = yes: your nCore login, for Prowlarr's nCore indexer.
ncore_user     = <nCore username>
ncore_password = <nCore password>
# Only with [setup] whisparr = yes: your StashDB API key (stashdb.org, your profile), for Desireerr.
stashdb_key    = <StashDB API key>

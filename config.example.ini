# rss2transmission configuration
# Secrets (feed URL, RPC login, ntfy topic) live in secrets.ini, not here.
# "~" is expanded. After editing, nothing needs restarting: the next timer run picks it up.

[general]
# Root of the media disk. All [routes] folders are relative to this.
storage_root      = /mnt/storage
# Refuse to add torrents if storage_root is not a mounted disk
# (prevents filling the system disk when the HDD fails to mount).
require_mount     = yes
# Drop .torrent files here by hand; they're added and moved to archive_dir.
watch_dir         = ~/torrents
# Copy of every added .torrent file, for reference/re-adding.
archive_dir       = ~/old_torrents
# Push a warning when the storage disk is fuller than this (at most once a day).
disk_warn_percent = 90
# nCore categories that are TV series: each show gets its own folder inside the category's
# folder (SERIES/HD/HU/The Last of Us/...), named from the release name up to S01 / S01E02,
# so Jellyfin sees one show instead of one per season pack or episode. An existing folder
# for the show is reused (case, punctuation and a missing "(year)" don't matter, so you can
# rename it). Releases without a season marker stay in the category's folder. Empty: off.
# With [setup] arr = yes, hdser_hun and hdser are left out: those folders are Sonarr's.
show_folders      = hdser_hun, hdser, xvidser_hun, xvidser, dvdser_hun, dvdser

[transmission]
rpc_url = http://localhost:9091/transmission/rpc
# Seconds to wait for Transmission / nCore before giving up until the next run.
timeout = 30
# With a UPS ([setup] ups): stop the torrents while the box runs on battery (less disk and
# network for the battery to feed), and start them again when the power is back. Torrents you
# had stopped yourself stay stopped. yes or no.
pause_on_battery = yes

[ntfy]
# With [setup] own_ntfy = yes, setup.sh sets this to the box's own server (http://localhost:2586),
# and back to https://ntfy.sh when you switch it off.
server = https://ntfy.sh
# Which events to push. Mount/disk problems are always pushed.
notify_added      = yes
notify_downloaded = yes
notify_removed    = yes
# ntfy priority: min, low, default, high, urgent
priority_added      = low
priority_downloaded = default
priority_removed    = low
priority_problem    = high

[cleanup]
# With [setup] arr = yes: Sonarr, Radarr and Whisparr download into <storage_root>/downloads
# and hardlink the files into the library, so a seeding download costs no space while the
# library has its files. Once the library lets go of them (a better release replaced it, or
# you deleted it there), the download is removed from Transmission with its files as soon as
# seeding is done. Downloads that were never imported, and everything outside the downloads
# folder, are left alone. yes or no.
remove_unused     = yes
# Minimal seeding: every download leaves Transmission as soon as seeding is done (below), not
# only the ones the library let go of. Imported Sonarr/Radarr/Whisparr downloads go with their
# files (the library keeps its own hardlinks, so nothing is lost); everything else (bookmarks,
# the watch dir, Prowlarr's search page) is only removed from Transmission, its files stay.
# An arr download that was never imported still stays. Works without arr too. yes (the
# default) or no; with no, downloads seed for as long as the library has them.
minimal_seed      = yes
# Seeding is done at this ratio, or after seed_hours + seed_hours_per_gb x size in GB of
# seeding. nCore asks for 48 h; the 2 more cover the tracker's announce interval.
seed_ratio        = 2.0
seed_hours        = 50
seed_hours_per_gb = 0.4

[routes]
# nCore category code = folder under storage_root.
# The code is taken from the torrent filename: "[nCore][hd_hun]Name.torrent" -> hd_hun
# Codes not listed here go to misc_dir.
misc_dir     = MISC

# Movies
hd_hun       = MOVIES/HD/HU
hd           = MOVIES/HD/EN
xvid_hun     = MOVIES/SD/HU
xvid         = MOVIES/SD/EN

# Series
hdser_hun    = SERIES/HD/HU
hdser        = SERIES/HD/EN
xvidser_hun  = SERIES/SD/HU
xvidser      = SERIES/SD/EN

# Music
mp3_hun      = MUSIC/LOSSY/HU
mp3          = MUSIC/LOSSY/EN
lossless_hun = MUSIC/LOSSLESS/HU
lossless     = MUSIC/LOSSLESS/EN

# Games
game_iso     = GAMES/PC
game_rip     = GAMES/PC
console      = GAMES/CNS

# Programs
iso          = PROGRAMS/PC
misc         = PROGRAMS/PC
mobil        = PROGRAMS/MBL

# E-books
ebook_hun    = EBOOKS/HU
ebook        = EBOOKS/EN

# Adult
xxx_hd       = XXX/HD
xxx_xvid     = XXX/SD
xxx_imageset = XXX/IMG

# Not routed today (they land in MISC, same as periodic.sh). Uncomment to give them a home:
# dvd_hun    = MOVIES/DVD/HU
# dvd        = MOVIES/DVD/EN
# dvdser_hun = SERIES/DVD/HU
# dvdser     = SERIES/DVD/EN
# clip       = CLIPS
# xxx_dvd    = XXX/DVD

[setup]
# Used by setup.sh only (rss2transmission ignores it).
# Media server for the storage disk: jellyfin (media library with apps for TVs and phones,
# needs a 64-bit CPU and a few GB of RAM), minidlna (lightweight DLNA, for small/old boxes)
# or none. Empty: setup.sh asks. To switch later, change it here and run setup.sh again.
media_server    =
# Share the storage disk on the LAN with Samba (\\box\storage): yes or no. Empty: setup.sh
# asks. Changing it to no and running setup.sh again removes the share.
samba           =
# Announce the box on the LAN with avahi (mDNS): yes or no. It answers as <hostname>.local
# without the router's help, and Macs / Linux file managers list the share. Empty: setup.sh
# asks. Changing it to no stops announcing the start page and the share (avahi stays).
avahi           =
# Remote access through Tailscale (needs a free Tailscale account): yes or no. Empty: setup.sh
# asks. Opens Transmission, the media server and the share to your tailnet.
tailscale       =
# With tailscale = yes: the start page and the web apps also over HTTPS on the tailnet, with
# Tailscale's own certificates (turn on HTTPS Certificates in its admin console, DNS page):
# https://<box>.<tailnet>.ts.net/, each app on its port + 10000 (Seerr: 15055). Plain http keeps
# working. yes or no. Empty: setup.sh asks. Changing it to no stops serving them.
tailscale_https =
# A certificate for the box's LAN names (say one signed by an authority of your own, trusted
# on your PCs): the start page is then also served over HTTPS on the LAN address, port 443, and
# each app on its port + 10000 (a TLS proxy, socat, per app). Both files, no spaces in the
# paths; read again when they change. Empty: not served.
lan_tls_cert    =
lan_tls_key     =
# ntfy as well as the pushes to the browsers the start page is installed in (Web Push, which
# needs the Tailscale HTTPS): yes or no. Empty: setup.sh asks (default no with tailscale_https,
# else yes; a box that already has an ntfy topic keeps it). With no and no topic yet, none is made.
ntfy            =
# Pushes through an ntfy server on this box (port 2586, only the LAN and the tailnet reach it)
# instead of the public ntfy.sh, whose operator can read them: yes or no. Empty: setup.sh
# asks (default yes with Tailscale). The phone gets them while Tailscale is on, or at home.
own_ntfy        =
# Prowlarr, Sonarr, Radarr and Seerr in Docker (search nCore, request movies and series from
# a phone or the TV): yes or no. Empty: setup.sh asks. Changing it to no stops them.
arr             =
# With arr = yes: Whisparr too, for nCore's XXX categories (scenes and movies into the
# xxx_hd / xxx_xvid folders), with Desireerr (github.com/vibesclauder/desireerr), its request app
# on port 5056: yes or no. Empty: setup.sh asks. Changing it to no removes Whisparr and stops
# Desireerr (its checkout and data stay).
whisparr        =
# With arr = yes: update the apps to their newest images every Monday night, and within the
# hour when an app says a new version is out (and push which were): yes (the default when
# empty) or no.
arr_auto_update =
# A UPS on USB (NUT's usbhid-ups driver: Eaton, APC, CyberPower and most others): NUT watches
# it, and shuts the box down cleanly when its battery runs low, on its own (nothing of
# torrent-box's has to be running for that). Power cuts, the low battery, the shutdown and the
# power coming back are pushed, and logged in ~/.local/state/rss2transmission/grid.log for good.
# auto (the default when empty): on when a known UPS is on USB, so boxes without one have
# nothing of it; yes or no. Changing it to no stops NUT and puts its config back as it was.
ups             =
# With a UPS: shut down when the battery is down to this percent, or to 2 minutes of runtime,
# whichever comes first. Empty: 40, which leaves margin for an ageing battery (the runtime the
# UPS estimates is optimistic then) and spares it the deep discharges that shorten its life.
ups_low_battery =
# Internet download speed in Mbit/s: sizes Transmission's write cache and peer limits.
# Empty: setup.sh measures it and asks. After changing plans, set it and run setup.sh again.
download_mbps   =

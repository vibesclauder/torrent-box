# rss2transmission configuration
# Secrets (feed URL, RPC login, ntfy topic) live in secrets.ini, not here.
# "~" is expanded. After editing, nothing needs restarting: the next timer run picks it up.

[general]
# Root of the media disk. All [routes] folders are relative to this.
storage_root      = /mnt/storage
# Refuse to add torrents if storage_root is not a mounted disk
# (prevents filling the system disk when the HDD fails to mount).
require_mount     = yes
# Drop .torrent files here by hand; they're added and moved to archive_dir.
watch_dir         = ~/torrents
# Copy of every added .torrent file, for reference/re-adding.
archive_dir       = ~/old_torrents
# Push a warning when the storage disk is fuller than this (at most once a day).
disk_warn_percent = 90
# nCore categories that are TV series: each show gets its own folder inside the category's
# folder (SERIES/HD/HU/The Last of Us/...), named from the release name up to S01 / S01E02,
# so Jellyfin sees one show instead of one per season pack or episode. An existing folder
# for the show is reused (case, punctuation and a missing "(year)" don't matter, so you can
# rename it). Releases without a season marker stay in the category's folder. Empty: off.
# With [setup] arr = yes, hdser_hun and hdser are left out: those folders are Sonarr's.
show_folders      = hdser_hun, hdser, xvidser_hun, xvidser, dvdser_hun, dvdser

[transmission]
rpc_url = http://localhost:9091/transmission/rpc
# Seconds to wait for Transmission / nCore before giving up until the next run.
timeout = 30

[ntfy]
# With [setup] own_ntfy = yes, setup.sh sets this to the box's own server (http://localhost:2586),
# and back to https://ntfy.sh when you switch it off.
server = https://ntfy.sh
# Which events to push. Mount/disk problems are always pushed.
notify_added      = yes
notify_downloaded = yes
# ntfy priority: min, low, default, high, urgent
priority_added      = low
priority_downloaded = default
priority_problem    = high

[routes]
# nCore category code = folder under storage_root.
# The code is taken from the torrent filename: "[nCore][hd_hun]Name.torrent" -> hd_hun
# Codes not listed here go to misc_dir.
misc_dir     = MISC

# Movies
hd_hun       = MOVIES/HD/HU
hd           = MOVIES/HD/EN
xvid_hun     = MOVIES/SD/HU
xvid         = MOVIES/SD/EN

# Series
hdser_hun    = SERIES/HD/HU
hdser        = SERIES/HD/EN
xvidser_hun  = SERIES/SD/HU
xvidser      = SERIES/SD/EN

# Music
mp3_hun      = MUSIC/LOSSY/HU
mp3          = MUSIC/LOSSY/EN
lossless_hun = MUSIC/LOSSLESS/HU
lossless     = MUSIC/LOSSLESS/EN

# Games
game_iso     = GAMES/PC
game_rip     = GAMES/PC
console      = GAMES/CNS

# Programs
iso          = PROGRAMS/PC
misc         = PROGRAMS/PC
mobil        = PROGRAMS/MBL

# E-books
ebook_hun    = EBOOKS/HU
ebook        = EBOOKS/EN

# Adult
xxx_hd       = XXX/HD
xxx_xvid     = XXX/SD
xxx_imageset = XXX/IMG

# Not routed today (they land in MISC, same as periodic.sh). Uncomment to give them a home:
# dvd_hun    = MOVIES/DVD/HU
# dvd        = MOVIES/DVD/EN
# dvdser_hun = SERIES/DVD/HU
# dvdser     = SERIES/DVD/EN
# clip       = CLIPS
# xxx_dvd    = XXX/DVD

[setup]
# Used by setup.sh only (rss2transmission ignores it).
# Media server for the storage disk: jellyfin (media library with apps for TVs and phones,
# needs a 64-bit CPU and a few GB of RAM), minidlna (lightweight DLNA, for small/old boxes)
# or none. Empty: setup.sh asks. To switch later, change it here and run setup.sh again.
media_server    =
# Share the storage disk on the LAN with Samba (\\box\storage): yes or no. Empty: setup.sh
# asks. Changing it to no and running setup.sh again removes the share.
samba           =
# Announce the box on the LAN with avahi (mDNS): yes or no. It answers as <hostname>.local
# without the router's help, and Macs / Linux file managers list the share. Empty: setup.sh
# asks. Changing it to no stops announcing the start page and the share (avahi stays).
avahi           =
# Remote access through Tailscale (needs a free Tailscale account): yes or no. Empty: setup.sh
# asks. Opens Transmission, the media server and the share to your tailnet.
tailscale       =
# Pushes through an ntfy server on this box (port 2586, only the LAN and the tailnet reach it)
# instead of the public ntfy.sh, whose operator can read them: yes or no. Empty: setup.sh
# asks (default yes with Tailscale). The phone gets them while Tailscale is on, or at home.
own_ntfy        =
# Prowlarr, Sonarr, Radarr and Seerr in Docker (search nCore, request movies and series from
# a phone or the TV): yes or no. Empty: setup.sh asks. Changing it to no stops them.
arr             =
# With arr = yes: Whisparr too, for nCore's XXX categories (scenes and movies into the
# xxx_hd / xxx_xvid folders), with Desireerr (github.com/vibesclauder/desireerr), its request app
# on port 5056: yes or no. Empty: setup.sh asks. Changing it to no removes Whisparr and stops
# Desireerr (its checkout and data stay).
whisparr        =
# With arr = yes: update the apps to their newest images every Monday night (and push which
# were): yes (the default when empty) or no.
arr_auto_update =
# Internet download speed in Mbit/s: sizes Transmission's write cache and peer limits.
# Empty: setup.sh measures it and asks. After changing plans, set it and run setup.sh again.
download_mbps   =
